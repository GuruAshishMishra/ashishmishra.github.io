<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Portfolio Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                Arial,
                sans-serif;

            background: #f5f7fb;
            color: #111827;
        }

        .login-wrapper {
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 420px;

            background: #ffffff;

            padding: 35px;

            border-radius: 16px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .login-box h1 {
            margin-bottom: 10px;
        }

        .login-box p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        input {
            width: 100%;

            padding: 13px 14px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            margin-bottom: 15px;

            font-size: 15px;
        }

        button {
            border: 0;

            padding: 12px 18px;

            border-radius: 8px;

            cursor: pointer;

            font-size: 14px;
        }

        #loginBtn {
            width: 100%;

            background: #111827;

            color: #ffffff;
        }

        #loginBtn:hover {
            background: #000000;
        }

        .error {
            color: #dc2626;
            margin-top: 15px;
        }

        .dashboard {
            display: none;
        }

        .topbar {
            background: #111827;
            color: #ffffff;

            padding: 18px 30px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .topbar h1 {
            font-size: 20px;
        }

        #logoutBtn {
            background: #ffffff;
            color: #111827;
        }

        .container {
            max-width: 1500px;

            margin: auto;

            padding: 30px;
        }

        .stats {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 20px;

            margin-bottom: 30px;
        }

        .stat-card {
            background: #ffffff;

            border-radius: 14px;

            padding: 22px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.05);
        }

        .stat-card span {
            display: block;

            color: #6b7280;

            font-size: 14px;

            margin-bottom: 8px;
        }

        .stat-card strong {
            font-size: 30px;
        }

        .table-wrapper {
            background: #ffffff;

            border-radius: 14px;

            overflow-x: auto;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;

            border-collapse: collapse;

            min-width: 1100px;
        }

        th,
        td {
            padding: 14px 16px;

            text-align: left;

            border-bottom:
                1px solid #e5e7eb;

            font-size: 13px;
        }

        th {
            background: #f9fafb;

            font-weight: 600;
        }

        tr:hover td {
            background: #fafafa;
        }

        .loading {
            padding: 30px;

            text-align: center;

            color: #6b7280;
        }

        .badge {
            display: inline-block;

            padding: 5px 8px;

            border-radius: 20px;

            font-size: 12px;

            background: #eef2ff;
        }

        @media (max-width: 900px) {

            .stats {
                grid-template-columns:
                    repeat(2, 1fr);
            }

            .container {
                padding: 15px;
            }

        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .topbar {
                padding: 15px;
            }

            .topbar h1 {
                font-size: 16px;
            }

        }

    </style>

</head>

<body>


    <!-- LOGIN -->

    <section
        class="login-wrapper"
        id="loginSection"
    >

        <div class="login-box">

            <h1>Admin Login</h1>

            <p>
                Sign in to view portfolio visitors.
            </p>

            <form id="loginForm">

                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="submit"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>

            <div
                class="error"
                id="loginError"
            ></div>

        </div>

    </section>


    <!-- DASHBOARD -->

    <section
        class="dashboard"
        id="dashboardSection"
    >

        <header class="topbar">

            <h1>
                Portfolio Visitor Dashboard
            </h1>

            <button id="logoutBtn">
                Logout
            </button>

        </header>


        <main class="container">


            <!-- STATS -->

            <div class="stats">

                <div class="stat-card">

                    <span>
                        Total Visitors
                    </span>

                    <strong id="totalVisitors">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        Today
                    </span>

                    <strong id="todayVisitors">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        Unique Sessions
                    </span>

                    <strong id="uniqueSessions">
                        0
                    </strong>

                </div>


                <div class="stat-card">

                    <span>
                        Page Views
                    </span>

                    <strong id="pageViews">
                        0
                    </strong>

                </div>

            </div>


            <!-- VISITOR TABLE -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>Date / Time</th>

                            <th>Device</th>

                            <th>Browser</th>

                            <th>OS</th>

                            <th>Screen</th>

                            <th>Page</th>

                            <th>Referrer</th>

                            <th>Language</th>

                            <th>Timezone</th>

                        </tr>

                    </thead>

                    <tbody
                        id="visitorTable"
                    >

                    </tbody>

                </table>

                <div
                    class="loading"
                    id="loading"
                >
                    Loading visitors...
                </div>

            </div>


        </main>

    </section>


<script>

    const SUPABASE_URL =
        "https://mzvwjacbobiyjrxedlef.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_q_F2HIAo7lB2M_kFLssXmQ_Y-vcLthd";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    const loginSection =
        document.getElementById(
            "loginSection"
        );

    const dashboardSection =
        document.getElementById(
            "dashboardSection"
        );

    const loginForm =
        document.getElementById(
            "loginForm"
        );

    const loginError =
        document.getElementById(
            "loginError"
        );

    const logoutBtn =
        document.getElementById(
            "logoutBtn"
        );


    async function checkSession() {

        const {
            data
        } =
            await supabaseClient
                .auth
                .getSession();


        if (
            data &&
            data.session
        ) {

            showDashboard();

        } else {

            showLogin();

        }

    }


    function showLogin() {

        loginSection.style.display =
            "flex";

        dashboardSection.style.display =
            "none";

    }


    function showDashboard() {

        loginSection.style.display =
            "none";

        dashboardSection.style.display =
            "block";

        loadVisitors();

    }


    loginForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            loginError.textContent = "";

            const email =
                document.getElementById(
                    "email"
                ).value.trim();

            const password =
                document.getElementById(
                    "password"
                ).value;


            const {
                data,
                error
            } =
                await supabaseClient
                    .auth
                    .signInWithPassword({
                        email: email,
                        password: password
                    });


            if (error) {

                loginError.textContent =
                    error.message;

                return;

            }


            if (data.session) {

                showDashboard();

            }

        }
    );


    logoutBtn.addEventListener(
        "click",
        async function () {

            await supabaseClient
                .auth
                .signOut();

            showLogin();

        }
    );


    async function loadVisitors() {

        const table =
            document.getElementById(
                "visitorTable"
            );

        const loading =
            document.getElementById(
                "loading"
            );


        loading.style.display =
            "block";


        const {
            data,
            error
        } =
            await supabaseClient
                .from("visitor_logs")
                .select("*")
                .order(
                    "visited_at",
                    {
                        ascending: false
                    }
                )
                .limit(500);


        if (error) {

            loading.textContent =
                "Error loading visitors: " +
                error.message;

            return;

        }


        loading.style.display =
            "none";


        table.innerHTML = "";


        if (
            !data ||
            data.length === 0
        ) {

            table.innerHTML = `
                <tr>
                    <td colspan="9">
                        No visitors yet.
                    </td>
                </tr>
            `;

            updateStats([]);

            return;

        }


        data.forEach(
            function (visitor) {

                const row =
                    document.createElement(
                        "tr"
                    );


                const date =
                    new Date(
                        visitor.visited_at
                    );


                const formattedDate =
                    date.toLocaleString(
                        "en-IN",
                        {
                            dateStyle:
                                "medium",
                            timeStyle:
                                "short"
                        }
                    );


                row.innerHTML = `

                    <td>
                        ${escapeHTML(
                            formattedDate
                        )}
                    </td>

                    <td>
                        <span class="badge">
                            ${escapeHTML(
                                visitor.device_type || "-"
                            )}
                        </span>
                    </td>

                    <td>
                        ${escapeHTML(
                            visitor.browser || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            visitor.operating_system || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            (visitor.screen_width || "-") +
                            " × " +
                            (visitor.screen_height || "-")
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            visitor.page_title || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            visitor.referrer || "Direct"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            visitor.language || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHTML(
                            visitor.timezone || "-"
                        )}
                    </td>

                `;


                table.appendChild(row);

            }
        );


        updateStats(data);

    }


    function updateStats(data) {

        const total =
            data.length;


        const today =
            new Date()
                .toISOString()
                .split("T")[0];


        const todayCount =
            data.filter(
                function (visitor) {

                    return visitor.visited_at
                        .startsWith(today);

                }
            ).length;


        const sessions =
            new Set(
                data.map(
                    function (visitor) {
                        return visitor.session_id;
                    }
                )
            );


        document.getElementById(
            "totalVisitors"
        ).textContent =
            total;


        document.getElementById(
            "todayVisitors"
        ).textContent =
            todayCount;


        document.getElementById(
            "uniqueSessions"
        ).textContent =
            sessions.size;


        document.getElementById(
            "pageViews"
        ).textContent =
            total;

    }


    function escapeHTML(value) {

        return String(value)
            .replace(
                /&/g,
                "&amp;"
            )
            .replace(
                /</g,
                "&lt;"
            )
            .replace(
                />/g,
                "&gt;"
            )
            .replace(
                /"/g,
                "&quot;"
            )
            .replace(
                /'/g,
                "&#039;"
            );

    }


    checkSession();

</script>
<script src="../js/visitor-tracker.js"></script>
</body>

</html>
